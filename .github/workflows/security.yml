name: Security

on:
  schedule:
    - cron: '0 2 * * 1'
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

env:
  NODE_ENV: test
  CI: true

jobs:
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Run npm audit
        id: audit
        run: |
          # 生产依赖审计（阻断）：仅检查生产依赖，发现 CRITICAL/HIGH 即失败
          npm audit --omit=dev --audit-level=moderate --json > audit-prod.json || true

          # 全量审计（报告）：包含开发依赖，用于报告但不阻断
          npm audit --audit-level=moderate --json > audit-report.json || true

          # 生产依赖漏洞（阻断标准）
          PROD_CRITICAL=$(cat audit-prod.json | jq '.metadata.vulnerabilities.critical // 0')
          PROD_HIGH=$(cat audit-prod.json | jq '.metadata.vulnerabilities.high // 0')
          PROD_MODERATE=$(cat audit-prod.json | jq '.metadata.vulnerabilities.moderate // 0')

          # 全量漏洞（含开发依赖，仅报告）
          TOTAL_CRITICAL=$(cat audit-report.json | jq '.metadata.vulnerabilities.critical // 0')
          TOTAL_HIGH=$(cat audit-report.json | jq '.metadata.vulnerabilities.high // 0')
          TOTAL_MODERATE=$(cat audit-report.json | jq '.metadata.vulnerabilities.moderate // 0')

          echo "prod_critical=$PROD_CRITICAL" >> $GITHUB_OUTPUT
          echo "prod_high=$PROD_HIGH" >> $GITHUB_OUTPUT
          echo "prod_moderate=$PROD_MODERATE" >> $GITHUB_OUTPUT
          echo "total_critical=$TOTAL_CRITICAL" >> $GITHUB_OUTPUT
          echo "total_high=$TOTAL_HIGH" >> $GITHUB_OUTPUT
          echo "total_moderate=$TOTAL_MODERATE" >> $GITHUB_OUTPUT

          echo "## 🔍 NPM Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 生产依赖（阻断标准）" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Critical | $PROD_CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| High | $PROD_HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| Moderate | $PROD_MODERATE |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 全量依赖（含开发依赖，仅报告）" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Critical | $TOTAL_CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| High | $TOTAL_HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| Moderate | $TOTAL_MODERATE |" >> $GITHUB_STEP_SUMMARY

          # 开发依赖漏洞发出警告但不阻断
          DEV_HIGH=$((TOTAL_HIGH - PROD_HIGH))
          DEV_CRITICAL=$((TOTAL_CRITICAL - PROD_CRITICAL))
          if [[ "$DEV_CRITICAL" -gt 0 || "$DEV_HIGH" -gt 0 ]]; then
            echo "::warning::Found $DEV_CRITICAL critical and $DEV_HIGH high vulnerabilities in devDependencies (non-blocking)"
          fi

          # 仅生产依赖的 CRITICAL/HIGH 阻断 CI
          if [[ "$PROD_CRITICAL" -gt 0 || "$PROD_HIGH" -gt 0 ]]; then
            echo "::error::Found $PROD_CRITICAL critical and $PROD_HIGH high vulnerabilities in production dependencies"
            exit 1
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-audit-report
          path: |
            audit-report.json
            audit-prod.json
          retention-days: 30

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:javascript-typescript"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4.9.0
        continue-on-error: true
        # 当仓库未启用 Dependency Graph 时，dependency-review-action 会失败。
        # 此处设置 continue-on-error 避免阻断 PR；如需严格审查，请在仓库设置中
        # 启用 Dependency Graph（Settings → Code security → Dependency graph）。
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [npm-audit, codeql]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| NPM Audit | ${{ needs.npm-audit.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL | ${{ needs.codeql.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📅 Scan completed at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
