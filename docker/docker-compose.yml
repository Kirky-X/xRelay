version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: xrelay-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xrelay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-xrelay}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - xrelay_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xrelay-network

  # xRelay 应用
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: xrelay-app
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-xrelay}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-xrelay}
      ENABLE_API_KEY: ${ENABLE_API_KEY:-false}
      API_KEYS: ${API_KEYS:-}
      KV_REST_API_URL: ${KV_REST_API_URL:-}
      KV_REST_API_TOKEN: ${KV_REST_API_TOKEN:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - xrelay-network
    restart: unless-stopped

  # Redis (可选，用于 KV 存储)
  redis:
    image: redis:7-alpine
    container_name: xrelay-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xrelay-network

volumes:
  xrelay_postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  xrelay-network:
    driver: bridge