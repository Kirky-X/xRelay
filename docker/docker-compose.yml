version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: xrelay-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xrelay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-xrelay}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - xrelay_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xrelay-network

  # xRelay 应用
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: xrelay-app
    environment:
      NODE_ENV: production
      # 容器内需监听 0.0.0.0 才能接收端口映射流量；
      # 主机侧已在 ports 中绑定 127.0.0.1，外部无法直接访问
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-xrelay}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-xrelay}
      # 生产环境默认启用 API Key 验证，需通过 API_KEYS 提供密钥
      ENABLE_API_KEY: ${ENABLE_API_KEY:-true}
      API_KEYS: ${API_KEYS:?API_KEYS is required in production}
      # 生产环境必须配置 CRON_SECRET，保护清理任务端点
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required in production}
      # 生产环境必须显式配置 CORS_ORIGINS（逗号分隔）
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required in production}
      KV_REST_API_URL: ${KV_REST_API_URL:-}
      KV_REST_API_TOKEN: ${KV_REST_API_TOKEN:-}
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 健康检查走 /api/health 端点，期望 200
      # 使用 node 内置 http 模块，避免依赖 wget/curl
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - xrelay-network
    restart: unless-stopped

  # Redis (可选，用于 KV 存储)
  redis:
    image: redis:7-alpine
    container_name: xrelay-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # 使用 REDISCLI_AUTH 环境变量传递密码（避免 -a 在 process list 暴露密码）
      test: ["CMD", "sh", "-c", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xrelay-network

volumes:
  xrelay_postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  xrelay-network:
    driver: bridge